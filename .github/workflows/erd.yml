name: ERD
on:
  push:
    paths:
      - "backend/**/models.py"
      - "backend/**/models/**"
      - ".github/workflows/erd.yml"
permissions:
  contents: write
jobs:
  erd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y graphviz
      - run: pip install -r backend/requirements.txt
      - name: Generate ERD
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: "ci-only-secret-key"
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: "localhost"
          POSTGRES_DB: "ci_db"
          POSTGRES_USER: "ci_user"
          POSTGRES_PASSWORD: "ci_password"
          POSTGRES_HOST: "localhost"
          POSTGRES_PORT: "5432"
          CORS_ALLOWED_ORIGINS: "http://localhost:3000"
          ORTHANC_URL: "http://localhost:8042"
          ORTHANC_PUBLIC_URL: "http://localhost:8042"
          ORTHANC_USER: "admin"
          ORTHANC_PASSWORD: "password"
        run: |
          python manage.py graph_models patients segmentation extraction mlops users \
            --group-models \
            --exclude-models Group,Permission,AbstractUser,AbstractBaseUser,PermissionsMixin \
            --no-inheritance \
            --hide-edge-labels \
            --rankdir LR \
            --dot > ../docs/erd.dot
          dot -Tsvg ../docs/erd.dot -o ../docs/erd.svg
          rm ../docs/erd.dot
      - name: Commit if changed
        run: |
          git config user.name "erd-bot"
          git config user.email "erd-bot@users.noreply.github.com"
          git add docs/erd.svg
          git diff --cached --quiet || (git commit -m "docs: regenerate ERD [skip ci]" && git push)