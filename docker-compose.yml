services:
  postgres:
    image: postgres:16
    env_file: .env
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["${POSTGRES_HOST_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    env_file: .env
    command: server /data --console-address ":9001"
    volumes: [minio-data:/data]
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    env_file: .env
    depends_on:
      minio:
        condition: service_healthy
    volumes: [./infra/minio/init.sh:/init.sh:ro]
    entrypoint: ["sh", "/init.sh"]

  orthanc:
    image: orthancteam/orthanc:26.9.1
    volumes:
      - ./infra/orthanc/orthanc.json:/etc/orthanc/orthanc.json:ro
      - orthanc-db:/var/lib/orthanc/db
    ports: ["8042:8042", "4242:4242"]

  backend:
    build: ./backend
    env_file: .env
    # Dev: auto-reload on code changes (the image default runs gunicorn).
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    # Orthanc is an external service reached via ORTHANC_URL – no depends_on on purpose.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes: [./backend:/app/backend, ./data:/data]
    ports: ["${BACKEND_HOST_PORT:-8000}:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  frontend:
    build: ./frontend
    env_file: .env
    depends_on:
      backend:
        condition: service_healthy
    volumes: [./frontend/src:/app/src]
    ports: ["5173:5173"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  gateway:
    image: nginx:1.27-alpine
    environment:
      ORTHANC_GATEWAY_AUTH: ${ORTHANC_GATEWAY_AUTH}
    depends_on: [backend, frontend, orthanc]
    volumes: [./infra/gateway/default.conf.template:/etc/nginx/templates/default.conf.template:ro]
    ports: ["${GATEWAY_HOST_PORT:-8080}:80"]

  mlflow:
    build: ./infra/mlflow
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    entrypoint: ["sh", "-c"]
    command:
      - >-
        mlflow server --host 0.0.0.0 --port 5000
        --backend-store-uri postgresql://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@postgres:5432/$${POSTGRES_DB}
        --artifacts-destination s3://mlflow --serve-artifacts
    ports: ["5000:5000"]

  worker-segmentation:
    build: {context: ., dockerfile: workers/segmentation/Dockerfile}
    profiles: ["ml"]
    env_file: .env
    depends_on: [redis, postgres, minio, orthanc, mlflow]
    volumes: [./backend:/app/backend, ./workers:/app/workers, ./data:/data]
    # TODO: GPU reservation

  worker-segmentation-convert:
    build: {context: ., dockerfile: workers/segmentation/Dockerfile}
    profiles: ["ml"]
    env_file: .env
    depends_on: [redis, postgres, minio, orthanc]
    volumes: [./backend:/app/backend, ./workers:/app/workers]
    command: ["celery", "-A", "config", "worker", "-Q", "segmentation-convert",
              "-I", "workers.segmentation.tasks", "--concurrency=2", "--loglevel=info"]

  worker-extraction:
    build: {context: ., dockerfile: workers/extraction/Dockerfile}
    profiles: ["ml"]
    env_file: .env
    depends_on: [redis, postgres, minio]
    volumes: [./backend:/app/backend, ./workers:/app/workers]
    networks: [default, llm]

  worker-training:
    build: {context: ., dockerfile: workers/training/Dockerfile}
    profiles: ["ml"]
    env_file: .env
    depends_on: [redis, postgres, minio, mlflow]
    volumes: [./backend:/app/backend, ./workers:/app/workers, ./data:/data]
    # TODO: GPU reservation

  llm-model:
    image: minio/mc:latest
    profiles: ["llm"]
    env_file: .env
    depends_on:
      minio-init:
        condition: service_completed_successfully
    volumes: [./infra/llm-server/fetch-model.sh:/fetch-model.sh:ro, llm-models:/models]
    entrypoint: ["sh", "/fetch-model.sh"]

  llm-server:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    profiles: ["llm"]
    depends_on:
      llm-model:
        condition: service_completed_successfully
    command: -m /models/${LLM_MODEL_FILE} --host 0.0.0.0 --port 8080 -c 8192 -ngl 99
    volumes: [llm-models:/models:ro]
    networks: [llm]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]

networks:
  llm:
    internal: true

volumes:
  pgdata:
  orthanc-db:
  minio-data:
  llm-models:
