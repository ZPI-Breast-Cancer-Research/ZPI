[project]
name = "mri-breast-analysis"
version = "0.1.0"
description = "Analiza zmian w MRI piersi z uczeniem w pętli z ekspertem (nnU-Net v2 + Bielik-7B)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # backend / API
    "django>=5.1",
    "djangorestframework>=3.15",
    "django-cors-headers>=4.4",
    "django-environ>=0.11",
    "psycopg[binary]>=3.2",
    # async
    "celery[redis]>=5.4",
    "redis>=5.0",
    # DICOM / obrazy
    "pydicom>=2.4",
    "nibabel>=5.2",
    "numpy>=1.26",
    "requests>=2.32",
    # storage (MinIO / S3)
    "boto3>=1.34",
    # MLOps
    "mlflow>=2.16",
]

[project.optional-dependencies]
# Segmentation / training workers (GPU)
ml = [
    "torch>=2.3",
    "nnunetv2>=2.5",
    "SimpleITK>=2.3",
    "dicom2nifti>=2.4",
    "sentence-transformers>=3.0", # embeddingi do doboru przykładów few-shot
]
# Report extraction worker – mirrors workers/extraction/requirements*.txt
extraction = [
    "pydantic>=2.7,<3",
    "requests>=2.32,<3",
    "pillow>=10,<14",
]
extraction-paddle = [
    "mri-breast-analysis[extraction]",
    "paddlepaddle>=3.0,<4",
    "paddleocr>=3.0,<4",
]
# Fine-tuning LoRA/QLoRA Bielika
llm-training = [
    "transformers>=4.44",
    "peft>=0.12",
    "bitsandbytes>=0.43",
    "accelerate>=0.33",
    "datasets>=2.20",
]
# Serwowanie modelu docelowo (Linux + CUDA)
vllm = ["vllm>=0.6"]
monai = ["monai>=1.3"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.15",
    "mypy>=1.15",
    "django-stubs>=5.0",
    "pre-commit>=3.8",
    # notebooks (notebook/*.ipynb)
    "jupyter>=1.0",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "djangorestframework-stubs>=3.15",
    "types-requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "workers"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = [".", "backend"]
extend-exclude = ["frontend", "data", "**/migrations/**"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "DJ",      # django
    "C4",      # comprehensions
    "SIM",     # simplify
    "PIE",
    "RET",     # return
    "PTH",     # pathlib over os.path
    "PERF",    # performance anti-patterns
    "PL",      # pylint
    "RUF",     # ruff-specific
    "T20",     # print
    "S",       # bandit
]
ignore = [
    "E501",     # line length is the formatter's job; long prompts/strings are fine
    "PLR0913",  # too-many-arguments
    "PLR0917",  # too-many-positional-arguments
    "PLR2004",  # magic-value-comparison (thresholds in ML code)
    "RUF001",   # ambiguous unicode (Polish text: ó, –, …)
    "RUF002",
    "RUF003",
    "PLC0415",  # lazy imports of heavy deps (paddle, PIL) are intentional
    "S101",     # assert is used for type narrowing
]

[tool.ruff.lint.per-file-ignores]
# exploratory code: prints, bare expressions as cell output, quick loops
"notebook/*.ipynb" = [
    "E402", "E702", "E741", "T20", "B007", "B018", "B023", "B905",
    "C408", "PERF", "PLR", "RUF005", "S",
]
"**/tests.py" = ["S"]
"workers/extraction/__main__.py" = ["T20"]  # CLI output

[tool.ruff.lint.isort]
known-first-party = ["workers", "config", "common", "users", "patients", "mlops"]

[tool.ruff.lint.pylint]
max-branches = 15

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["backend", "."]
testpaths = ["backend", "workers"]
python_files = ["tests.py", "test_*.py"]

[tool.mypy]
python_version = "3.11"
files = ["backend", "workers"]
mypy_path = "backend"
explicit_package_bases = true
exclude = ['/migrations/']
plugins = ["mypy_django_plugin.main"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true
check_untyped_defs = true
no_implicit_reexport = true
extra_checks = true

# Typed code: no untyped definitions allowed.
[[tool.mypy.overrides]]
module = ["workers.extraction.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true

# Third-party packages without type information.
[[tool.mypy.overrides]]
module = ["paddleocr.*", "environ.*", "boto3.*", "celery.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"
