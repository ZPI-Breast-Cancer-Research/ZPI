[project]
name = "mri-breast-analysis"
version = "0.1.0"
description = "Analiza zmian w MRI piersi z uczeniem w pętli z ekspertem (nnU-Net v2 + Bielik-7B)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # backend / API
    "django>=5.1",
    "djangorestframework>=3.15",
    "django-cors-headers>=4.4",
    "django-environ>=0.11",
    "psycopg[binary]>=3.2",
    # async
    "celery[redis]>=5.4",
    "redis>=5.0",
    # DICOM / obrazy
    "pydicom>=2.4",
    "nibabel>=5.2",
    "numpy>=1.26",
    "requests>=2.32",
    # storage (MinIO / S3)
    "boto3>=1.34",
    # MLOps
    "mlflow>=2.16",
]

[project.optional-dependencies]
# Segmentation / training workers (GPU)
ml = [
    "torch>=2.3",
    "nnunetv2>=2.5",
    "SimpleITK>=2.3",
    "dicom2nifti>=2.4",
    "sentence-transformers>=3.0", # embeddingi do doboru przykładów few-shot
]
# Report extraction worker – mirrors workers/extraction/requirements*.txt
extraction = [
    "pydantic>=2.7,<3",
    "requests>=2.32,<3",
    "pillow>=10,<14",
]
extraction-paddle = [
    "mri-breast-analysis[extraction]",
    "paddlepaddle>=3.0,<4",
    "paddleocr>=3.0,<4",
]
# Fine-tuning LoRA/QLoRA Bielika
llm-training = [
    "transformers>=4.44",
    "peft>=0.12",
    "bitsandbytes>=0.43",
    "accelerate>=0.33",
    "datasets>=2.20",
]
# Serwowanie modelu docelowo (Linux + CUDA)
vllm = ["vllm>=0.6"]
monai = ["monai>=1.3"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.6",
    "mypy>=1.11",
    "django-stubs>=5.0",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "workers"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["frontend", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["backend", "."]
testpaths = ["backend", "workers"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "config.settings"
